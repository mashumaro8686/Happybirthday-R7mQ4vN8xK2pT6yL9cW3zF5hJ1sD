<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>Happy Birthday ひよりちゃん</title>
  <style>
    :root{
      --night:#08162f;
      --night2:#171a4f;
      --cream:#fff8e8;
      --gold:#ffd978;
      --pink:#ffb4cf;
      --aqua:#79e6df;
      --deep:#2a1f4f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"Kiwi Maru","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;background:var(--night);color:white}
    body{overflow:hidden}
    button{font:inherit}
    #app{position:relative;width:100vw;height:100vh;min-height:100svh;overflow:hidden;background:
      radial-gradient(circle at 50% 25%, rgba(91,108,255,.22), transparent 33%),
      linear-gradient(180deg,var(--night2),var(--night) 62%,#050b18)}
    .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .8s ease,transform .8s ease}
    .hidden{opacity:0;pointer-events:none;transform:scale(1.03)}
    .stars{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
    .star{position:absolute;z-index:1;width:2px;height:2px;border-radius:50%;background:white;box-shadow:0 0 8px #fff,0 0 14px rgba(255,255,255,.55);animation:twinkle 2.4s infinite ease-in-out}
    @keyframes twinkle{0%,100%{opacity:.18;transform:scale(.75)}50%{opacity:1;transform:scale(1.55)}}
    .sparkle-star{position:absolute;z-index:2;width:18px;height:18px;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,245,195,.95)) drop-shadow(0 0 18px rgba(255,221,130,.65));animation:glimmer 3.2s infinite ease-in-out;opacity:.95}
    .sparkle-star::before,.sparkle-star::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,rgba(255,255,255,0),#fff7d8,rgba(255,255,255,0));border-radius:999px}
    .sparkle-star::before{width:3px;height:100%}
    .sparkle-star::after{width:100%;height:3px}
    .sparkle-star .diag1,.sparkle-star .diag2{position:absolute;left:50%;top:50%;width:100%;height:3px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff2bf,rgba(255,255,255,0));border-radius:999px}
    .sparkle-star .diag1{transform:translate(-50%,-50%) rotate(45deg)}
    .sparkle-star .diag2{transform:translate(-50%,-50%) rotate(-45deg)}
    @keyframes glimmer{0%,100%{opacity:.35;transform:scale(.7) rotate(0deg)}35%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.45) rotate(8deg)}65%{opacity:.85;transform:scale(1.08)} }

    /* Opening */
    #intro{flex-direction:column;justify-content:flex-end;padding-bottom:10vh}
    .sky-title{position:absolute;top:12vh;text-align:center;width:100%;z-index:5;padding:0 16px}
    .sky-title .small{display:none}
    .sky-title h1{margin:.2rem 0 0;display:flex;flex-direction:column;align-items:center;gap:.45rem;font-size:clamp(2.5rem,10vw,5.8rem);font-weight:400;line-height:1.05;text-shadow:0 0 22px rgba(255,224,160,.35)}
    .sky-title h1 span{color:var(--gold)}
    .sky-title h1 .title-script{font-family:"Times New Roman",serif;letter-spacing:.03em;color:#fff6d7}
    .sky-title h1 .title-name{font-family:"Times New Roman",serif;font-size:clamp(2rem,7vw,4.2rem);letter-spacing:.06em;color:#ffe9fb;text-shadow:0 0 18px rgba(255,214,244,.38),0 0 34px rgba(255,238,185,.22)}
    .castle-wrap{position:absolute;bottom:8vh;width:min(90vw,620px);height:52vh;display:flex;align-items:flex-end;justify-content:center}
    .castle{width:100%;height:100%}
    .moon-glow{position:absolute;bottom:20vh;width:55vw;height:25vw;max-width:500px;max-height:230px;background:radial-gradient(ellipse,rgba(255,231,166,.2),transparent 68%);filter:blur(4px)}
    .shooting{position:absolute;left:-15vw;top:19vh;width:130vw;height:52vh;pointer-events:none}
    .trail{fill:none;stroke:url(#trailGrad);stroke-width:3;stroke-linecap:round;stroke-dasharray:760;stroke-dashoffset:760;filter:url(#glow);animation:drawTrail 3s 1s ease-out forwards}
    .shooting-star{offset-path:path("M 15 255 C 165 15, 520 5, 780 150 C 950 245, 1010 195, 1110 110");offset-distance:0%;animation:fly 3s 1s ease-out forwards;filter:drop-shadow(0 0 8px white)}
    @keyframes drawTrail{to{stroke-dashoffset:0}}
    @keyframes fly{to{offset-distance:100%}}
    .tap-intro{position:relative;z-index:8;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:white;padding:13px 24px;border-radius:999px;letter-spacing:.04em;font-family:"M PLUS Rounded 1c","Kiwi Maru",sans-serif;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.18);animation:pulse 2s infinite}
    @keyframes pulse{50%{transform:translateY(-3px);box-shadow:0 12px 34px rgba(0,0,0,.24),0 0 22px rgba(255,226,155,.18)}}

    /* Party screen */
    #party{padding:24px;overflow:auto;align-items:flex-start}
    .party-inner{width:min(94vw,760px);padding:7vh 0 12vh;position:relative;z-index:5}
    .party-heading{text-align:center;margin-bottom:24px}
    .party-heading .eyebrow{font-size:.84rem;letter-spacing:.12em;opacity:.78;font-family:"M PLUS Rounded 1c","Kiwi Maru",sans-serif}
    .party-heading h2{margin:.3rem 0 .2rem;font-family:"Yomogi","Kiwi Maru","M PLUS Rounded 1c",sans-serif;font-size:clamp(2.5rem,9vw,4.7rem);color:var(--gold);font-weight:400}
    .party-heading p{margin:0;opacity:.85}

    .card-shell{perspective:1200px;margin:24px auto 0;width:min(92vw,620px);min-height:410px}
    .card{position:relative;width:100%;min-height:410px;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.7,.1,1);cursor:pointer}
    .card.open{transform:rotateY(-180deg)}
    .face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
    .front{background:linear-gradient(145deg,#fffaf0,#ffe9f1);color:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;border:8px solid rgba(255,215,120,.38)}
    .front .gift{font-size:72px;filter:drop-shadow(0 8px 12px rgba(70,34,85,.16));animation:bob 2.2s infinite ease-in-out}
    @keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
    .front h3{font-family:"Yomogi","Kiwi Maru","M PLUS Rounded 1c",sans-serif;font-size:2rem;margin:12px 0 4px;font-weight:400}
    .front p{margin:0;opacity:.78;font-family:"M PLUS Rounded 1c","Kiwi Maru",sans-serif}
    .back{transform:rotateY(180deg);background:linear-gradient(180deg,#fffdf9,#fff3f6);color:#3c3155;padding:28px 24px 30px;overflow:auto}
    .back h3{text-align:center;font-family:"Yomogi","Kiwi Maru","M PLUS Rounded 1c",sans-serif;color:#6f8fb5;font-size:1.95rem;margin:0 0 16px;font-weight:400;text-shadow:0 1px 0 rgba(255,255,255,.7),0 0 14px rgba(111,143,181,.12)}
    .message{white-space:pre-wrap;line-height:2.05;font-size:1.06rem;background:rgba(255,255,255,.74);border:1px solid rgba(143,85,137,.15);border-radius:22px;padding:20px;min-height:220px;font-family:"Yomogi","Kiwi Maru","M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}
    .signature{text-align:right;margin-top:16px;color:#6f8fb5;font-weight:700;font-family:"Yomogi","Kiwi Maru","M PLUS Rounded 1c",sans-serif;font-size:1.1rem}
    .hint{text-align:center;margin-top:14px;font-size:.84rem;opacity:.76;font-family:"M PLUS Rounded 1c","Kiwi Maru",sans-serif}

    /* Decorations */
    .decor{position:absolute;z-index:4;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))}
    .patch-plush{left:4vw;bottom:8vh;width:112px;animation:floaty 3s ease-in-out infinite}
    .bear-band{right:2vw;bottom:7vh;width:190px;animation:floaty 3.6s .4s ease-in-out infinite}
    .birds{right:4vw;top:7vh;width:170px;animation:floaty 3.2s .2s ease-in-out infinite}
    .sea-buddies{left:3vw;top:2.5vh;width:185px;animation:floaty 3.1s .15s ease-in-out infinite}
    @keyframes floaty{50%{transform:translateY(-10px) rotate(1deg)}}

    .balloon{position:absolute;bottom:-140px;width:52px;height:66px;border-radius:50% 50% 48% 48%;opacity:.9;z-index:2;animation:rise linear infinite;box-shadow:inset -8px -10px 15px rgba(0,0,0,.12)}
    .balloon:after{content:"";position:absolute;left:50%;top:65px;width:1px;height:95px;background:rgba(255,255,255,.42)}
    .balloon:before{content:"";position:absolute;left:22px;bottom:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid currentColor}
    @keyframes rise{to{transform:translateY(-125vh) rotate(9deg)}}

    #confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
    .confetti-piece{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
    @keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(900deg);opacity:.9}}

    .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3bd;box-shadow:0 0 14px #fff3bd;animation:spark 1.8s infinite ease-in-out}
    @keyframes spark{0%,100%{transform:scale(.5);opacity:.2}50%{transform:scale(1.7);opacity:1}}

    @media (max-width:600px){
      .patch-plush{width:82px;left:-6px;bottom:5vh}
      .bear-band{width:135px;right:-16px;bottom:4vh}
      .birds{width:118px;right:-4px;top:8vh}
      .sea-buddies{width:116px;left:-2px;top:7.5vh}
      .party-inner{padding-top:5vh}
      .card-shell,.card{min-height:440px}
      .message{font-size:.96rem}
      .sky-title{top:10vh}
      .sky-title h1{gap:.35rem}
      .sky-title h1 .title-name{font-size:clamp(1.8rem,8vw,3rem)}
    }
  </style>
</head>

  <script>
    const CARD = {
      name: "ひよりちゃん",
      message: `ひよりちゃんお誕生日おめでとう。

まず、プレゼント遅れてごめんね。
チケットはいつでも、いつまでも使えるひよりちゃん専用のチケットだから、大切に持っててね。

一緒にディズニーランドに行けたのも、本当に楽しかったね。
美味しいポテトチップスも、照り焼きチキンレッグも、冷麺も美味しかったね。
他にも沢山あるけど、全部いい思い出だよ。

フォレストシアターのショーもすごく感動した。
でも、ショーを見て感動してるひよりちゃんを見てたら、それで余計に感極まった。

涙腺ゆるゆるで、美味しいものを食べた時とか、感動するシーンを見た時とか、心を揺さぶられるとすぐ涙が出るひよりちゃんが大好きだよ。
そういう素直なところも、優しいところも、これからもずっと大切にしてほしいなって思ってる。

この1年、本当に色々なことがあったね。
ひよりちゃんも、俺に対して不満に思ったことや、嫌だったことも沢山あると思う。

付き合ってから、もう3年になるのかな。
振り返ると本当に色んなことがあったけど、その分、一緒に過ごしてきた時間も思い出も沢山増えたね。
楽しかったことも、しんどかったことも含めて、今までひよりちゃんと一緒に過ごしてこれたことを嬉しく思ってる。

俺はいつもひよりちゃんのことを考えてるし、できるだけいつでも楽しい気持ちでいてほしいと思ってる。
だからこれからは、もっともっとひよりちゃんを幸せにできる人になります。

文章拙くてごめんね。
この1年も一緒にいてくれてありがとう。
いつも支えになってくれてありがとう。

なんか途中から記念日寄りの文章になっちゃったけど、9月5日はひよりちゃんが生まれてきてくれた大切な日だから、改めてお誕生日おめでとう。

これからも、もっともっとたくさん思い出作ろう。
また仲良く、楽しい1年にしようね。`,
      from: "ゆうと"
    };
  </script>

<script>
  const intro = document.getElementById("intro");
  const party = document.getElementById("party");
  const enterBtn = document.getElementById("enterBtn");
  const card = document.getElementById("card");
  const confettiLayer = document.getElementById("confetti");

  document.getElementById("nameText").textContent = CARD.name;
  document.getElementById("nameText2").textContent = CARD.name;
  document.getElementById("messageText").textContent = CARD.message;
  document.getElementById("fromText").textContent = CARD.from;

  // Balloons
  const balloonColors = ["#ff9dbb","#7fe0d6","#f6cf69","#b9a7ff","#ffb36a","#8fc8ff"];
  function addBalloons(){
    for(let i=0;i<12;i++){
      const b=document.createElement("div");
      b.className="balloon";
      b.style.left=(Math.random()*96)+"vw";
      b.style.background=balloonColors[i%balloonColors.length];
      b.style.color=balloonColors[i%balloonColors.length];
      b.style.animationDuration=(7+Math.random()*6)+"s";
      b.style.animationDelay=(-Math.random()*8)+"s";
      party.appendChild(b);
    }
  }

  function burstConfetti(count=150){
    const colors=["#ffd86a","#ff9fbd","#75e1d7","#b7a6ff","#ffb36a","#ffffff"];
    for(let i=0;i<count;i++){
      const c=document.createElement("span");
      c.className="confetti-piece";
      c.style.left=Math.random()*100+"vw";
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration=(2.7+Math.random()*2.2)+"s";
      c.style.animationDelay=(Math.random()*.5)+"s";
      c.style.setProperty("--drift",(-90+Math.random()*180)+"px");
      c.style.transform=`rotate(${Math.random()*180}deg)`;
      confettiLayer.appendChild(c);
      setTimeout(()=>c.remove(),5500);
    }
  }

  let entered=false;
  enterBtn.addEventListener("click",()=>{
    if(entered) return;
    entered=true;
    intro.classList.add("hidden");
    party.classList.remove("hidden");
    addBalloons();
    burstConfetti(190);
    setTimeout(()=>card.classList.add("open"),900);
  });

  card.addEventListener("click",()=>{
    card.classList.toggle("open");
    if(card.classList.contains("open")) burstConfetti(80);
  });
</script>
