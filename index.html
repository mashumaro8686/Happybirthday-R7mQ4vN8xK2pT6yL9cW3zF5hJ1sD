<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Happy Birthday ひよりちゃん</title>
  <style>
    :root{
      --night:#08162f;
      --night2:#171a4f;
      --cream:#fff8e8;
      --gold:#ffd978;
      --pink:#ffb4cf;
      --aqua:#79e6df;
      --deep:#2a1f4f;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--night);color:white}
    body{overflow:hidden}
    button{font:inherit}
    #app{position:relative;width:100vw;height:100vh;min-height:100svh;overflow:hidden;background:
      radial-gradient(circle at 50% 25%, rgba(91,108,255,.22), transparent 33%),
      linear-gradient(180deg,var(--night2),var(--night) 62%,#050b18)}
    .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .8s ease,transform .8s ease}
    .hidden{opacity:0;pointer-events:none;transform:scale(1.03)}
    .stars{position:absolute;inset:0;overflow:hidden;pointer-events:none}
    .star{position:absolute;width:2px;height:2px;border-radius:50%;background:white;box-shadow:0 0 8px #fff;animation:twinkle 2s infinite ease-in-out}
    @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.5)}}

    /* Opening */
    #intro{flex-direction:column;justify-content:flex-end;padding-bottom:10vh}
    .sky-title{position:absolute;top:15vh;text-align:center;width:100%;z-index:5}
    .sky-title .small{letter-spacing:.24em;font-size:.78rem;opacity:.8;text-transform:uppercase}
    .sky-title h1{margin:.4rem 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.4rem,10vw,5.6rem);font-weight:600;letter-spacing:.01em;text-shadow:0 0 22px rgba(255,224,160,.35)}
    .sky-title h1 span{color:var(--gold)}
    .castle-wrap{position:absolute;bottom:8vh;width:min(90vw,620px);height:52vh;display:flex;align-items:flex-end;justify-content:center}
    .castle{width:100%;height:100%}
    .moon-glow{position:absolute;bottom:20vh;width:55vw;height:25vw;max-width:500px;max-height:230px;background:radial-gradient(ellipse,rgba(255,231,166,.2),transparent 68%);filter:blur(4px)}
    .shooting{position:absolute;left:-15vw;top:19vh;width:130vw;height:52vh;pointer-events:none}
    .trail{fill:none;stroke:url(#trailGrad);stroke-width:3;stroke-linecap:round;stroke-dasharray:760;stroke-dashoffset:760;filter:url(#glow);animation:drawTrail 3s 1s ease-out forwards}
    .shooting-star{offset-path:path("M 15 255 C 165 15, 520 5, 780 150 C 950 245, 1010 195, 1110 110");offset-distance:0%;animation:fly 3s 1s ease-out forwards;filter:drop-shadow(0 0 8px white)}
    @keyframes drawTrail{to{stroke-dashoffset:0}}
    @keyframes fly{to{offset-distance:100%}}
    .tap-intro{position:relative;z-index:8;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:white;padding:13px 24px;border-radius:999px;letter-spacing:.08em;box-shadow:0 8px 28px rgba(0,0,0,.18);animation:pulse 2s infinite}
    @keyframes pulse{50%{transform:translateY(-3px);box-shadow:0 12px 34px rgba(0,0,0,.24),0 0 22px rgba(255,226,155,.18)}}

    /* Party screen */
    #party{padding:24px;overflow:auto;align-items:flex-start}
    .party-inner{width:min(94vw,760px);padding:7vh 0 12vh;position:relative;z-index:5}
    .party-heading{text-align:center;margin-bottom:24px}
    .party-heading .eyebrow{font-size:.82rem;letter-spacing:.18em;opacity:.7}
    .party-heading h2{margin:.3rem 0 .2rem;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.3rem,9vw,4.5rem);color:var(--gold)}
    .party-heading p{margin:0;opacity:.85}

    .card-shell{perspective:1200px;margin:24px auto 0;width:min(92vw,620px);min-height:410px}
    .card{position:relative;width:100%;min-height:410px;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.7,.1,1);cursor:pointer}
    .card.open{transform:rotateY(-180deg)}
    .face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden}
    .front{background:linear-gradient(145deg,#fffaf0,#ffe9f1);color:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;border:8px solid rgba(255,215,120,.38)}
    .front .gift{font-size:72px;filter:drop-shadow(0 8px 12px rgba(70,34,85,.16));animation:bob 2.2s infinite ease-in-out}
    @keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
    .front h3{font-family:Georgia,"Times New Roman",serif;font-size:2rem;margin:12px 0 4px}
    .front p{margin:0;opacity:.7}
    .back{transform:rotateY(180deg);background:linear-gradient(180deg,#fffdf9,#fff3f6);color:#3c3155;padding:28px 24px 30px;overflow:auto}
    .back h3{text-align:center;font-family:Georgia,"Times New Roman",serif;color:#8f5589;font-size:1.8rem;margin:0 0 16px}
    .message{white-space:pre-wrap;line-height:1.9;font-size:1rem;background:rgba(255,255,255,.7);border:1px solid rgba(143,85,137,.15);border-radius:20px;padding:20px;min-height:220px}
    .signature{text-align:right;margin-top:16px;color:#8f5589;font-weight:700}
    .hint{text-align:center;margin-top:14px;font-size:.82rem;opacity:.7}

    /* Decorations */
    .decor{position:absolute;z-index:4;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(0,0,0,.25))}
    .patch-plush{left:4vw;bottom:8vh;width:112px;animation:floaty 3s ease-in-out infinite}
    .bear-band{right:2vw;bottom:7vh;width:190px;animation:floaty 3.6s .4s ease-in-out infinite}
    .birds{right:4vw;top:12vh;width:170px;animation:floaty 3.2s .2s ease-in-out infinite}
    @keyframes floaty{50%{transform:translateY(-10px) rotate(1deg)}}

    .balloon{position:absolute;bottom:-140px;width:52px;height:66px;border-radius:50% 50% 48% 48%;opacity:.9;z-index:2;animation:rise linear infinite;box-shadow:inset -8px -10px 15px rgba(0,0,0,.12)}
    .balloon:after{content:"";position:absolute;left:50%;top:65px;width:1px;height:95px;background:rgba(255,255,255,.42)}
    .balloon:before{content:"";position:absolute;left:22px;bottom:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid currentColor}
    @keyframes rise{to{transform:translateY(-125vh) rotate(9deg)}}

    #confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
    .confetti-piece{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
    @keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(900deg);opacity:.9}}

    .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3bd;box-shadow:0 0 14px #fff3bd;animation:spark 1.8s infinite ease-in-out}
    @keyframes spark{0%,100%{transform:scale(.5);opacity:.2}50%{transform:scale(1.7);opacity:1}}

    @media (max-width:600px){
      .patch-plush{width:82px;left:-6px;bottom:5vh}
      .bear-band{width:135px;right:-16px;bottom:4vh}
      .birds{width:118px;right:-4px;top:12vh}
      .party-inner{padding-top:5vh}
      .card-shell,.card{min-height:440px}
      .message{font-size:.96rem}
    }
  </style>
</head>
<body>
<div id="app">
  <div class="stars" id="stars"></div>

  <!-- =========
       ここだけ後で書き換えればOK
       ========= -->
  <script>
    const CARD = {
      name: "ひよりちゃん",
      message: `ひよりちゃんお誕生日おめでとう。

まず、プレゼント遅れてごめんね。
チケットはいつでも、いつまでも使えるひよりちゃん専用のチケットだから、大切に持っててね。

一緒にディズニーランドに行けたのも、本当に楽しかったね。
美味しいポテトチップスも、照り焼きチキンレッグも、冷麺も美味しかったね。
他にも沢山あるけど、全部いい思い出だよ。

フォレストシアターのショーもすごく感動した。
でも、ショーを見て感動してるひよりちゃんを見てたら、それで余計に感極まった。

涙腺ゆるゆるで、美味しいものを食べた時とか、感動するシーンを見た時とか、心を揺さぶられるとすぐ涙が出るひよりちゃんが大好きだよ。
そういう素直なところも、優しいところも、これからもずっと大切にしてほしいなって思ってる。

この1年、本当に色々なことがあったね。
ひよりちゃんも、俺に対して不満に思ったことや、嫌だったことも沢山あると思う。

付き合ってから、もう3年になるのかな。
振り返ると本当に色んなことがあったけど、その分、一緒に過ごしてきた時間も思い出も沢山増えたね。
楽しかったことも、しんどかったことも含めて、今までひよりちゃんと一緒に過ごしてこれたことを嬉しく思ってる。

俺はいつもひよりちゃんのことを考えてるし、できるだけいつでも楽しい気持ちでいてほしいと思ってる。
だからこれからは、もっともっとひよりちゃんを幸せにできる人になります。

文章拙くてごめんね。
この1年も一緒にいてくれてありがとう。
いつも支えになってくれてありがとう。

なんか途中から記念日寄りの文章になっちゃったけど、9月5日はひよりちゃんが生まれてきてくれた大切な日だから、改めてお誕生日おめでとう。

これからも、もっともっとたくさん思い出作ろう。
また仲良く、楽しい1年にしようね。`,
      from: "ゆうと"
    };
  </script>

  <section class="screen" id="intro" aria-label="オープニング">
    <div class="sky-title">
      <div class="small">A little celebration for</div>
      <h1>Happy <span>Birthday</span></h1>
    </div>

    <div class="moon-glow"></div>

    <svg class="shooting" viewBox="0 0 1120 320" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="trailGrad" x1="0" x2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>

      <svg class="castle" viewBox="0 0 620 420" aria-label="オリジナルのお城シルエット">

          M310 177l28 34h-56z"/>
        <g fill="#ffd978" opacity=".7">
          <rect x="301" y="236" width="18" height="30" rx="7"/>
          <rect x="201" y="300" width="14" height="24" rx="6"/>
          <rect x="405" y="300" width="14" height="24" rx="6"/>
          <rect x="130" y="338" width="12" height="21" rx="5"/>
          <rect x="478" y="338" width="12" height="21" rx="5"/>
        </g>
      </svg>
    </div>

    <button class="tap-intro" id="enterBtn">Tap to Open ✨</button>
  </section>

  <section class="screen hidden" id="party" aria-label="バースデーカード">
    <div class="party-inner">
      <div class="party-heading">
        <div class="eyebrow">HAPPY BIRTHDAY</div>
        <h2 id="nameText"></h2>
        <p>今日はちょっと特別なカードです。</p>
      </div>

      <div class="card-shell">
        <div class="card" id="card">
          <div class="face front">
            <div class="gift">🎁</div>
            <h3>ひらいてみて</h3>
            <p>カードをタップ</p>
          </div>
          <div class="face back">
            <h3>For <span id="nameText2"></span></h3>
            <div class="message" id="messageText"></div>
            <div class="signature" id="fromText"></div>
          </div>
        </div>
      </div>
      <div class="hint">もう一度タップするとカードを閉じられます</div>
    </div>

    <!-- オリジナルの「つぎはぎぬいぐるみ」 -->
    <svg class="decor patch-plush" viewBox="0 0 120 150" aria-label="つぎはぎ風ぬいぐるみ">
      <ellipse cx="61" cy="96" rx="38" ry="42" fill="#a7e7cf"/>
      <circle cx="60" cy="50" r="34" fill="#b9f1dc"/>
      <circle cx="34" cy="31" r="16" fill="#f9c3d6"/><circle cx="87" cy="31" r="16" fill="#f6dc7b"/>
      <circle cx="48" cy="48" r="4" fill="#4d4260"/><circle cx="73" cy="48" r="4" fill="#4d4260"/>
      <path d="M52 65 Q60 71 68 65" fill="none" stroke="#4d4260" stroke-width="3" stroke-linecap="round"/>
      <path d="M38 82 l18 10 l-16 13 z" fill="#ffb8c9" opacity=".9"/>
      <path d="M77 79 l18 12 l-19 12 z" fill="#f4d66f" opacity=".9"/>
      <g stroke="#6d6680" stroke-width="2"><path d="M42 17l8 11"/><path d="M77 20l-5 13"/><path d="M35 113l14-6"/><path d="M75 119l11-8"/></g>
      <circle cx="37" cy="76" r="3" fill="#fff"/><circle cx="86" cy="69" r="3" fill="#fff"/>
    </svg>

    <!-- オリジナルのカントリー熊トリオ -->
    <svg class="decor bear-band" viewBox="0 0 250 150" aria-label="カントリー調の熊バンド">
      <g transform="translate(8,38)">
        <circle cx="50" cy="46" r="33" fill="#9a6a43"/><circle cx="30" cy="21" r="13" fill="#9a6a43"/><circle cx="70" cy="21" r="13" fill="#9a6a43"/>
        <ellipse cx="50" cy="53" rx="18" ry="14" fill="#c99566"/><circle cx="50" cy="47" r="5" fill="#3d2a2a"/>
        <path d="M41 61q9 8 18 0" fill="none" stroke="#3d2a2a" stroke-width="3"/>
        <path d="M17 18h66l-12-12H29z" fill="#d9b14f"/><rect x="28" y="6" width="43" height="13" rx="4" fill="#d9b14f"/>
        <rect x="18" y="88" width="64" height="9" rx="5" fill="#6f472d"/>
      </g>
      <g transform="translate(86,23)">
        <circle cx="50" cy="46" r="33" fill="#b58455"/><circle cx="30" cy="21" r="13" fill="#b58455"/><circle cx="70" cy="21" r="13" fill="#b58455"/>
        <ellipse cx="50" cy="53" rx="18" ry="14" fill="#deb482"/><circle cx="50" cy="47" r="5" fill="#3d2a2a"/>
        <path d="M41 61q9 8 18 0" fill="none" stroke="#3d2a2a" stroke-width="3"/>
        <path d="M18 20h64l-10-13H28z" fill="#8a5440"/><rect x="27" y="7" width="45" height="13" rx="4" fill="#8a5440"/>
        <circle cx="51" cy="98" r="23" fill="#c98355"/><circle cx="51" cy="98" r="8" fill="#8d5839"/>
      </g>
      <g transform="translate(164,38)">
        <circle cx="50" cy="46" r="33" fill="#805338"/><circle cx="30" cy="21" r="13" fill="#805338"/><circle cx="70" cy="21" r="13" fill="#805338"/>
        <ellipse cx="50" cy="53" rx="18" ry="14" fill="#b87a50"/><circle cx="50" cy="47" r="5" fill="#2f2225"/>
        <path d="M41 61q9 8 18 0" fill="none" stroke="#2f2225" stroke-width="3"/>
        <path d="M18 18h64l-12-11H30z" fill="#557c79"/><rect x="29" y="6" width="42" height="12" rx="4" fill="#557c79"/>
        <path d="M28 92q22-20 44 0" fill="none" stroke="#d8bd68" stroke-width="7"/>
      </g>
    </svg>

    <!-- オリジナルの南国の鳥たち -->
    <svg class="decor birds" viewBox="0 0 190 150" aria-label="南国風の鳥たち">
      <g transform="translate(0,22)">
        <ellipse cx="52" cy="58" rx="31" ry="39" fill="#5ed2cf"/>
        <circle cx="48" cy="38" r="25" fill="#79e6df"/>

        <path d="M67 39l23 8-23 8z" fill="#f6bd56"/>
        <path d="M28 66q-18 8-22 28q21-4 35-19z" fill="#4caeb0"/>
        <path d="M46 14l10-12 8 15" fill="none" stroke="#ffb1cf" stroke-width="7" stroke-linecap="round"/>
        <path d="M42 15l-8-12-8 14" fill="none" stroke="#ffb1cf" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g transform="translate(78,2)">
        <ellipse cx="52" cy="58" rx="31" ry="39" fill="#ff8cab"/>
        <circle cx="48" cy="38" r="25" fill="#ffacc1"/>
        <circle cx="41" cy="34" r="4" fill="#20223d"/>
        <path d="M67 39l23 8-23 8z" fill="#f6bd56"/>
        <path d="M28 66q-18 8-22 28q21-4 35-19z" fill="#e36e91"/>
        <path d="M46 14l10-12 8 15" fill="none" stroke="#8bdedb" stroke-width="7" stroke-linecap="round"/>
        <path d="M42 15l-8-12-8 14" fill="none" stroke="#8bdedb" stroke-width="7" stroke-linecap="round"/>
      </g>
    </svg>
  </section>

  <div id="confetti"></div>
</div>

<script>
  const intro = document.getElementById("intro");
  const party = document.getElementById("party");
  const enterBtn = document.getElementById("enterBtn");
  const card = document.getElementById("card");
  const confettiLayer = document.getElementById("confetti");

  document.getElementById("nameText").textContent = CARD.name;
  document.getElementById("nameText2").textContent = CARD.name;
  document.getElementById("messageText").textContent = CARD.message;
  document.getElementById("fromText").textContent = CARD.from;

  // Stars
  const stars = document.getElementById("stars");
  for (let i=0;i<95;i++){
    const s = document.createElement("i");
    s.className = "star";
    s.style.left = Math.random()*100+"%";
    s.style.top = Math.random()*100+"%";
    const size = 1 + Math.random()*2.7;
    s.style.width = size+"px";
    s.style.height = size+"px";
    s.style.animationDelay = Math.random()*2+"s";
    s.style.animationDuration = 1.5 + Math.random()*2.5+"s";
    stars.appendChild(s);
  }

  // Balloons
  const balloonColors = ["#ff9dbb","#7fe0d6","#f6cf69","#b9a7ff","#ffb36a","#8fc8ff"];
  function addBalloons(){
    for(let i=0;i<12;i++){
      const b=document.createElement("div");
      b.className="balloon";
      b.style.left=(Math.random()*96)+"vw";
      b.style.background=balloonColors[i%balloonColors.length];
      b.style.color=balloonColors[i%balloonColors.length];
      b.style.animationDuration=(7+Math.random()*6)+"s";
      b.style.animationDelay=(-Math.random()*8)+"s";
      party.appendChild(b);
    }
  }

  function burstConfetti(count=150){
    const colors=["#ffd86a","#ff9fbd","#75e1d7","#b7a6ff","#ffb36a","#ffffff"];
    for(let i=0;i<count;i++){
      const c=document.createElement("span");
      c.className="confetti-piece";
      c.style.left=Math.random()*100+"vw";
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration=(2.7+Math.random()*2.2)+"s";
      c.style.animationDelay=(Math.random()*.5)+"s";
      c.style.setProperty("--drift",(-90+Math.random()*180)+"px");
      c.style.transform=`rotate(${Math.random()*180}deg)`;
      confettiLayer.appendChild(c);
      setTimeout(()=>c.remove(),5500);
    }
  }

  let entered=false;
  enterBtn.addEventListener("click",()=>{
    if(entered) return;
    entered=true;
    intro.classList.add("hidden");
    party.classList.remove("hidden");
    addBalloons();
    burstConfetti(190);
    setTimeout(()=>card.classList.add("open"),900);
  });

  card.addEventListener("click",()=>{
    card.classList.toggle("open");
    if(card.classList.contains("open")) burstConfetti(80);
  });
</script>
</body>
</html>
